<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Administrativo - Laguna Los Corrales</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Bootstrap Icons (for scriptLogin.js compatibility) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Montserrat:wght@600;700&display=swap');
    body {
      font-family: 'Outfit', sans-serif;
    }
    .font-title {
      font-family: 'Montserrat', sans-serif;
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .custom-input {
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .custom-input:focus {
      border-color: #a1824a;
      box-shadow: 0 0 0 3px rgba(161, 130, 74, 0.2);
      background: rgba(30, 41, 59, 0.8);
    }
  </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 flex flex-col justify-between relative overflow-hidden">
  
  <!-- Decorative Background Glows -->
  <div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] rounded-full bg-amber-500/10 blur-[120px] pointer-events-none"></div>
  <div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] rounded-full bg-blue-500/10 blur-[120px] pointer-events-none"></div>

  <!-- Webmail Top Bar Quick Link -->
  <div class="w-full flex justify-end p-6 z-10">
    <a href="https://astra360webhosting.cl:2096/" target="_blank" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-slate-900/80 hover:bg-slate-900 border border-slate-800 hover:border-slate-700 text-xs font-semibold text-slate-300 hover:text-white transition-all shadow-md">
      <i class="bi bi-envelope-fill text-amber-500 mr-1"></i> Acceder a Webmail
    </a>
  </div>

  <!-- Main Login Card Container -->
  <div class="flex-1 flex flex-col justify-center items-center px-4 sm:px-6 lg:px-8 z-10">
    <div class="w-full max-w-md">
      
      <!-- Brand Logo / Identity -->
      <div class="text-center mb-8">
        <img src="assets/Logo-Blanco@300x.png" alt="Laguna Los Corrales Logo" class="mx-auto h-16 w-auto filter drop-shadow(0 4px 10px rgba(0,0,0,0.3))">
        <h2 class="mt-4 text-2xl font-bold font-title text-white tracking-tight">Panel de Control</h2>
        <p class="mt-2 text-sm text-slate-400">Ingresa tus credenciales de administrador</p>
      </div>

      <!-- Login Card -->
      <div class="glass-card rounded-3xl p-8">
        <form id="login-form" class="space-y-6">
          
          <!-- Email Input -->
          <div>
            <label for="email" class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-2">Correo Electrónico</label>
            <div class="relative rounded-xl shadow-sm">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                <i class="bi bi-envelope text-slate-500 text-sm"></i>
              </div>
              <input type="email" id="email" name="email" required placeholder="admin@portallacustre.cl" class="custom-input block w-full pl-10 pr-4 py-3 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none">
            </div>
          </div>

          <!-- Password Input -->
          <div>
            <label for="password" class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-2">Contraseña</label>
            <div class="relative rounded-xl shadow-sm">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                <i class="bi bi-lock text-slate-500 text-sm"></i>
              </div>
              <input type="password" id="password" name="password" required placeholder="••••••••" class="custom-input block w-full pl-10 pr-12 py-3 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none">
              <button type="button" id="show-password" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-500 hover:text-slate-300 focus:outline-none">
                <i class="bi bi-eye text-sm"></i>
              </button>
            </div>
          </div>

          <!-- Hidden Admin Checkbox (Retains compatibility with scriptLogin.js) -->
          <div class="flex items-center" style="display: none;">
            <input id="myCheckbox" type="checkbox" class="h-4 w-4 text-amber-600 focus:ring-amber-500 border-slate-700 rounded bg-slate-900">
            <label for="myCheckbox" class="ml-2 block text-sm text-slate-400">Actualizar Usuario</label>
          </div>

          <!-- Hidden Secret Key Input (Retains compatibility with scriptLogin.js) -->
          <div class="secret-key" style="display: none;">
            <label for="secret_key" class="block text-xs font-bold text-slate-400 mb-2">Secret Key</label>
            <input type="text" id="secret_key" name="secret_key" disabled class="custom-input block w-full px-4 py-3 rounded-xl text-sm">
          </div>

          <!-- Submit Button -->
          <div>
            <button type="submit" id="buttonFuncionality" class="w-full py-3.5 px-4 rounded-xl bg-amber-600 hover:bg-amber-500 text-white font-bold font-title text-sm tracking-wider uppercase transition-colors shadow-lg hover:shadow-amber-600/20 focus:outline-none">
              Iniciar Sesión
            </button>
          </div>

        </form>
      </div>

    </div>
  </div>

  <!-- Footer Info -->
  <footer class="w-full text-center py-6 text-xs text-slate-500 z-10">
    &copy; 2026 Portal Lacustre. Todos los derechos reservados.
  </footer>

  <script src="./js/scriptLogin.js"></script>
</body>
</html>
